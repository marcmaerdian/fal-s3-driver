services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MARCMAERDIAN\FalS3Driver\:
    resource: '../Classes/*'

  # Registration happens through autoconfigure: since TYPO3 v14 a class
  # implementing ExtractorInterface is tagged automatically.
  MARCMAERDIAN\FalS3Driver\Index\ImageDimensionExtractor:
    public: true
